<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#667eea">
  <title>Flourishing Sims - 13 Psychological Needs</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="ui-container">
      <div id="title">
        <h1>Flourishing Sims</h1>
        <p>Cultivate the 13 Fundamental Psychological Needs</p>
      </div>

      <div id="needs-panel" class="minimized">
        <button id="toggle-needs" class="toggle-btn">📊</button>
        <div class="panel-content">
          <h2>Psychological Needs</h2>
          <div id="needs-list"></div>
        </div>
      </div>

      <div id="time-panel">
        <div id="time-display">Day 1 - 08:00</div>
      </div>

      <div id="relationships-panel" class="minimized">
        <button id="toggle-relationships" class="toggle-btn">👥</button>
        <div class="panel-content">
          <h2>Relationships</h2>
          <div id="relationships-list">No relationships yet</div>
        </div>
      </div>

      <div id="controls-info">
        <h3>Controls</h3>
        <p>Arrow Keys or WASD: Move character</p>
        <p>Mouse: Rotate camera</p>
        <p>Click on objects to interact</p>
      </div>

      <div id="interaction-prompt" style="display: none;">
        Press E to interact
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
